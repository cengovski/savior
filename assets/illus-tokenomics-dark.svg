<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00033E"/><stop offset="1" stop-color="#031A73"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3898EC"/><stop offset="1" stop-color="#8656EF"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#3898EC" stop-opacity=".45"/><stop offset="1" stop-color="#3898EC" stop-opacity="0"/></radialGradient></defs>
<rect width="480" height="320" rx="24" fill="url(#bg)"/><circle cx="240" cy="160" r="150" fill="url(#glow)"/>
<g fill="none" stroke="#ACC6E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M200 70A90 90 0 0 1 200 250" stroke="#3898EC" stroke-width="30" stroke-linecap="butt"/>
<path d="M200 250A90 90 0 0 1 200 70" stroke="#8656EF" stroke-width="30" stroke-linecap="butt"/><svg x="152" y="112" width="96" height="96" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" stroke="none" stroke-width="0">
  <defs>
    <radialGradient id="savior_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <linearGradient id="savior_shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <linearGradient id="savior_sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8edff"/>
    </linearGradient>
    <filter id="savior_glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="savior_softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  
  <circle cx="100" cy="100" r="100" fill="url(#savior_bg)"/>

  
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#savior_shieldGrad)" stroke-width="2" opacity="0.6"/>

  
  <path d="M100 28 L148 50 L148 100 Q148 138 100 165 Q52 138 52 100 L52 50 Z"
        fill="url(#savior_shieldGrad)" opacity="0.15"/>
  <path d="M100 32 L144 53 L144 100 Q144 135 100 160 Q56 135 56 100 L56 53 Z"
        fill="none" stroke="url(#savior_shieldGrad)" stroke-width="2.5" filter="url(#savior_glow)"/>

  
  <path d="M100 44 L132 60 L132 100 Q132 124 100 142 Q68 124 68 100 L68 60 Z"
        fill="url(#savior_shieldGrad)" opacity="0.08"/>

  
  <text x="100" y="118"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="68"
        font-weight="900"
        text-anchor="middle"
        fill="url(#savior_sGrad)"
        filter="url(#savior_softglow)"
        letter-spacing="-2">S</text>

  
  <circle cx="72" cy="155" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="100" cy="163" r="3" fill="#7b61ff" opacity="0.7"/>
  <circle cx="128" cy="155" r="3" fill="#00ff87" opacity="0.7"/>
</svg>
