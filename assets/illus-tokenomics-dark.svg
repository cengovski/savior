<rect x="330" y="190" width="16" height="16" rx="4" fill="#8656EF" stroke="none"/><text x="354" y="203" font-family="Space Mono,monospace" font-size="13" fill="#ACC6E9" stroke="none" text-anchor="start">50% LOCKED</text></g></svg>